name: Compile Public Tracker Routes

on:
  # Allows you to trigger the sync manually whenever you want by clicking a button!
  workflow_dispatch:
  
  # Automatically runs the sync on a quiet schedule behind the scenes
  schedule:
    - cron: '0 * * * *' # Runs automatically once every hour

permissions:
  contents: write

jobs:
  build-tracks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public QR Code Engine Code
        uses: actions/checkout@v4

      - name: Securely Fetch Private Roster Data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/LFF-Ambass-ops
          path: private-ops
          # Since the public repo is pulling its own organization data, it uses the built-in system token
          token: ${{ secrets.PRIVATE_ROSTER_PAT }} 

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Compilation Engine & Sanitize Data
        run: |
          cp private-ops/data/ambassadors.csv ./ambassadors.csv
          python manage_ambassadors.py
          rm -rf ./ambassadors.csv
          rm -rf ./private-ops

      - name: Deploy Live Tracking Updates
        run: |
          git config --global user.name "LFF Automated Build Engine"
          git config --global user.email "engine@lifetimefishingfund.org"
          git add .
          
          if git diff-index --quiet HEAD --; then
            echo "No structural tracking adjustments detected. Engine is clean."
          else
            git commit -m "Automated Sync: Recompiled tracking route nodes [System Deploy]"
            git push origin main
          fi
