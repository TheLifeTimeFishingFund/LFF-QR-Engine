name: Compile Public Tracker Routes

on:
  repository_dispatch:
    types: [roster_updated]

jobs:
  build-tracks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public QR Code Engine Code
        uses: actions/checkout@v4

      - name: Securely Fetch Private Roster Data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/LFF-Ambass-ops
          path: private-ops
          token: ${{ secrets.GITHUB_TOKEN }} # Automatically authorized to see your own account's private repos

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Compilation Engine & Sanitize Data
        run: |
          # Copy the private spreadsheet data into the execution workspace root
          cp private-ops/data/ambassadors.csv ./ambassadors.csv
          
          # Run the Python compiler script to build the tracking subdirectories
          python manage_ambassadors.py
          
          # CRITICAL STEP: Completely delete the raw private data before any code is pushed or saved
          rm -rf ./ambassadors.csv
          rm -rf ./private-ops

      - name: Deploy Live Tracking Updates
        run: |
          git config --global user.name "LFF Automated Build Engine"
          git config --global user.email "engine@lifetimefishingfund.org"
          git add .
          
          # Ensure there are actually new files to commit so the pipeline doesn't crash on identical saves
          if git diff-index --quiet HEAD --; then
            echo "No structural tracking adjustments detected. Engine is clean."
          else
            git commit -m "Automated Sync: Recompiled tracking route nodes [System Deploy]"
            git push origin main
          fi
